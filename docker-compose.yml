services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: go-dojo-server:${APP_ENV:-dev}
    container_name: go-dojo-server
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      PORT: ${SERVER_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "${SERVER_PORT}:3001"
    networks:
      - go-dojo-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: go-dojo-client:${APP_ENV:-dev}
    container_name: go-dojo-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      VITE_API_URL: http://server:3001
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - go-dojo-network

networks:
  go-dojo-network:
    driver: bridge